[env:nucleo_f303re]
platform = ststm32
board = nucleo_f303re
framework = arduino
monitor_speed = 460800

; Прапорці для активації апаратного FPU одинарної точності та оптимізації
build_flags = 
    -O2
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard

[env:native]
platform = native
test_framework = unity
test_build_src = true
platform_packages =
    toolchain-gccmingw32
extra_scripts =
    pre:scripts/native_compiler.py
build_flags =
    -std=gnu++11
    -Itest/include
    -static-libgcc
    -static-libstdc++
build_src_filter =
    -<*>
    +<dsp_pipeline.cpp>
    +<allan_tracker.cpp>
    +<telemetry.cpp>